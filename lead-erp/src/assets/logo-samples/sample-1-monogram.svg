<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    .box { animation: fadeScale 0.6s ease-out forwards; transform-origin: center; opacity: 0; }
    .letter { animation: slideUp 0.5s ease-out 0.3s forwards; opacity: 0; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes fadeScale { from { opacity:0; transform:scale(0.7); } to { opacity:1; transform:scale(1); } }
    @keyframes slideUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:0.15; } 50% { opacity:0.35; } }
  </style>
  <rect class="glow" x="4" y="4" width="56" height="56" rx="16" fill="url(#grad1)" opacity="0.15"/>
  <rect class="box" x="8" y="8" width="48" height="48" rx="14" fill="url(#grad1)"/>
  <text class="letter" x="32" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">C</text>
</svg>
