  <style>.p7s{animation:p7in .7s cubic-bezier(.2,.8,.2,1) forwards;opacity:0;transform-origin:center}.p7l{opacity:0;animation:p7let .5s ease-out .4s forwards}.p7sh{animation:p7sweep 4s ease-in-out 1s infinite}@keyframes p7in{from{opacity:0;transform:scale(.6) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes p7let{to{opacity:1}}@keyframes p7sweep{0%{transform:translateX(-60px)}40%,100%{transform:translateX(60px)}}</style>
