<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs><linearGradient id="pg3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fcd34d"/><stop offset="45%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ea580c"/></linearGradient></defs>
  <style>.p3ring{fill:none;stroke:url(#pg3);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:210;stroke-dashoffset:210;animation:p3draw 1.3s cubic-bezier(.4,0,.2,1) forwards}.p3l{opacity:0;animation:p3let .6s ease-out .9s forwards}.p3line{stroke-dasharray:24;stroke-dashoffset:24;animation:p3ln .5s ease-out 1.1s forwards}@keyframes p3draw{to{stroke-dashoffset:0}}@keyframes p3let{from{opacity:0}to{opacity:1}}@keyframes p3ln{to{stroke-dashoffset:0}}</style>
  <circle class="p3ring" cx="40" cy="40" r="30"/>
  <text class="p3l" x="40" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="600" fill="url(#pg3)">C</text>
  <line class="p3line" x1="30" y1="56" x2="50" y2="56" stroke="url(#pg3)" stroke-width="2" stroke-linecap="round"/>
</svg>
