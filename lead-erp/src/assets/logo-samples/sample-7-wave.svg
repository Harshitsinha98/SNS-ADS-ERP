<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    .bg7 { animation: bgIn 0.5s ease-out forwards; opacity:0; transform-origin:center; }
    .wave { animation: waveMove 3s ease-in-out infinite; opacity:0.15; }
    .wave2 { animation: waveMove 3s ease-in-out 1.5s infinite; opacity:0.1; }
    .letter7 { animation: rise7 0.4s ease-out 0.3s forwards; opacity:0; }
    @keyframes bgIn { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
    @keyframes waveMove { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
    @keyframes rise7 { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
  </style>
  <rect class="bg7" x="6" y="6" width="52" height="52" rx="16" fill="url(#grad7)"/>
  <path class="wave" d="M6,38 Q19,30 32,38 Q45,46 58,38 L58,58 Q58,64 52,58 L12,58 Q6,58 6,52 Z" fill="white"/>
  <path class="wave2" d="M6,42 Q19,34 32,42 Q45,50 58,42 L58,58 Q58,64 52,58 L12,58 Q6,58 6,52 Z" fill="white"/>
  <text class="letter7" x="32" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="white">C</text>
</svg>
